# local 프로파일에서만 적용되는 Spring 설정입니다.
spring:
  # 로컬 데이터베이스 연결을 설정합니다.
  datasource:
    # 메모리 H2를 PostgreSQL 호환 모드로 실행하고 JVM이 살아 있는 동안 유지합니다.
    url: jdbc:h2:mem:tracecart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    # H2 기본 사용자 이름입니다.
    username: sa
    # 로컬 H2는 비밀번호 없이 사용합니다.
    password:
    # 사용할 JDBC 드라이버 클래스를 명시합니다.
    driver-class-name: org.h2.Driver
  # 브라우저에서 H2를 확인할 수 있는 콘솔 설정입니다.
  h2:
    # H2 콘솔 기능 묶음입니다.
    console:
      # local에서만 웹 콘솔을 활성화합니다.
      enabled: true
  # local JPA 설정입니다.
  jpa:
    # Hibernate 스키마 생성 전략입니다.
    hibernate:
      # Flyway가 만든 스키마와 엔티티가 다르면 시작을 실패시킵니다.
      ddl-auto: validate

# local 환경의 패키지별 로그 레벨입니다.
logging:
  # 각 로거가 출력할 최소 수준을 설정합니다.
  level:
    # 프로젝트 코드는 DEBUG까지 보여 학습하기 쉽게 합니다.
    com.example.tracecart: DEBUG
    # Hibernate SQL은 지나치게 상세하지 않게 INFO부터 표시합니다.
    org.hibernate.SQL: INFO
