// 이 블록은 프로젝트에 필요한 Gradle 기능을 활성화합니다.
plugins {
    // Java 소스 컴파일, 테스트, JAR 작업을 추가합니다.
    id 'java'
    // 실행 가능한 Spring Boot JAR과 bootRun 작업을 추가합니다.
    id 'org.springframework.boot' version '4.1.1'
}

// 생성되는 Maven 좌표의 조직 이름입니다.
group = 'com.example'
// 현재 프로젝트 산출물의 버전입니다.
version = '0.1.0'
// Gradle 프로젝트 설명입니다.
description = 'Traceable order processing portfolio project'

// Java 컴파일러와 런타임 도구 버전을 고정합니다.
java {
    // 개발자 컴퓨터에 여러 JDK가 있어도 같은 버전을 선택하는 설정입니다.
    toolchain {
        // 소스와 빌드 기준을 사용자가 요청한 Java 21로 고정합니다.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 라이브러리를 내려받을 저장소를 지정합니다.
repositories {
    // 공개 Maven Central 저장소를 사용합니다.
    mavenCentral()
}

// 컴파일, 실행, 테스트에 필요한 외부 라이브러리를 선언합니다.
dependencies {
    // Spring Boot가 검증한 호환 버전을 모든 하위 라이브러리에 적용합니다.
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    // health, info, metrics 같은 운영 관찰 엔드포인트를 제공합니다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // JPA, Hibernate, Spring Data Repository를 제공합니다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // @NotNull, @Min, @Pattern 요청 검증 기능을 제공합니다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring MVC와 내장 Tomcat을 사용해 HTTP 요청을 받는 서버 기능을 제공합니다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // RestClient.Builder 빈과 동기식 외부 HTTP 호출 자동 설정을 제공합니다.
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    // 애플리케이션 시작 시 버전이 관리되는 DB 스키마 마이그레이션을 실행합니다.
    implementation 'org.springframework.boot:spring-boot-flyway'

    // local과 test 실행 때만 필요한 인메모리 H2 JDBC 드라이버입니다.
    runtimeOnly 'com.h2database:h2'
    // dev와 prod 실행 때만 필요한 PostgreSQL JDBC 드라이버입니다.
    runtimeOnly 'org.postgresql:postgresql'

    // JUnit, AssertJ, Spring Test, MockMvc 등 테스트 도구 모음입니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // PostgreSQL 컨테이너 연결 정보를 Spring Boot 테스트에 자동으로 제공합니다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // 실제 PostgreSQL에서 JPA, Flyway, 잠금 동작을 검증하는 일회용 컨테이너입니다.
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // @Testcontainers와 @Container로 컨테이너 생명주기를 JUnit 5에 연결합니다.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // Gradle이 JUnit Platform 테스트 엔진을 실행할 때 필요한 런처입니다.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PostgreSQL용 Flyway SQL 분석과 연결 지원은 별도 데이터베이스 모듈로 제공합니다.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
}

// Gradle의 test 작업 동작을 설정합니다.
tasks.named('test') {
    // JUnit 5 기반 Platform으로 모든 테스트를 검색하고 실행합니다.
    useJUnitPlatform()
}
